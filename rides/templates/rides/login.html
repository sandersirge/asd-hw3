{% extends "rides/base.html" %}
{% block title %}Sign in — Tasko{% endblock %}
{% block content %}
    <h2>Driver sign-in</h2>
    {% if form.errors %}
        <p style="color:#c62828">Invalid username or password.</p>
    {% endif %}
    <form method="post" class="login">
        {% csrf_token %}
        <p>
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" autofocus>
        </p>
        <p>
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password">
        </p>
        <p><button type="submit" class="primary">Sign in</button></p>
    </form>
    <p class="meta">
        Demo accounts (after running <code>seed_demo</code>):
        <strong>mari / tasko123</strong> or <strong>anna / tasko123</strong>.
    </p>
{% endblock %}
